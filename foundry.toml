[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
ffi = false
fs_permissions = []
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
gas_limit = 3000000000
dynamic_test_linking = false
isolate = false

[profile.default.fuzz]
runs = 256
